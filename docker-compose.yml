# LeadLens + PostgreSQL, the same shape as production (Render + Neon).
#   docker compose up --build      -> http://localhost:8080
#   ANTHROPIC_API_KEY=sk-... docker compose up --build   (optional: Claude-written briefs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadlens
      POSTGRES_USER: leadlens
      POSTGRES_PASSWORD: leadlens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/leadlens
      SPRING_DATASOURCE_USERNAME: leadlens
      SPRING_DATASOURCE_PASSWORD: leadlens
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
